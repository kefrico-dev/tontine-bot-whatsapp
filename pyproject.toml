[project]
name = "kefrico-tontine"
version = "0.1.0"
description = "Assistant WhatsApp pour créer, gérer et suivre des tontines."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pymongo>=4.13",
    "httpx>=0.27",
    "structlog>=24.4",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "mypy>=1.13",
]

[tool.uv]
package = false

# --- Lint / format -----------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",     # pycodestyle
    "F",     # pyflakes
    "W",     # pycodestyle warnings
    "I",     # isort
    "N",     # pep8-naming
    "UP",    # pyupgrade
    "B",     # bugbear
    "C4",    # comprehensions
    "SIM",   # simplify
    "ASYNC", # async pitfalls
    "S",     # bandit
    "RUF",
]

ignore = [
    # Les exceptions métier suivent la convention de CLAUDE.md
    # (TontineNotFound, MembershipNotFound…) et non le suffixe « Error ».
    "N818",
]

[tool.ruff.lint.per-file-ignores]
# assert, et valeurs factices ressemblant à des secrets
"tests/*" = ["S101", "S105", "S106"]

# --- Typage ------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
files = ["app"]
strict = true

# --- Tests -------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
addopts = "-q"
markers = [
    "integration: nécessite une instance MongoDB joignable (ignoré sinon)",
]
